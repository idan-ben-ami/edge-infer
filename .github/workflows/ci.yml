name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  generator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported (requires-python floor) and newest stable, to
        # catch breakage on both ends of the supported range.
        python-version: ["3.11", "3.14"]
    # Override the repo's .python-version pin so each matrix leg actually
    # runs on its own interpreter (UV_PYTHON beats .python-version in uv).
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies (no train extras)
        run: uv sync

      - name: Run --check on every example ONNX
        run: |
          for onnx in examples/*/[!_]*.onnx; do
            echo "::group::$onnx"
            uv run python edge_infer.py --check "$onnx"
            echo "::endgroup::"
          done

      - name: Regenerate the canonical example crate
        run: |
          uv run python edge_infer.py \
            examples/mnist/mnist_cnn.onnx \
            --output /tmp/mnist_ci/ \
            --quantize int8

      - name: Add Rust toolchain (stable + thumbv7em-none-eabihf)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Cross-compile generated crate (release)
        run: |
          cd /tmp/mnist_ci
          cargo build --release --target thumbv7em-none-eabihf
